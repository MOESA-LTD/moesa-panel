name: ci

on:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    app:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: app

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: app/pnpm-lock.yaml

            - run: pnpm install --frozen-lockfile
            # The build also generates auto-imports.d.ts and .eslintrc-auto-import.json (gitignored),
            # which typecheck and lint need.
            - run: pnpm build
            - run: pnpm lint
            - run: pnpm typecheck
            # Importing the app creates the Supabase client at module load; the tests never reach
            # the network, so placeholder values are enough.
            - run: pnpm test
              env:
                  VITE_SUPABASE_PROJECT_URL: http://127.0.0.1:54321
                  VITE_SUPABASE_PROJECT_ANON_KEY: ci-placeholder
            # The dev story seed's node tests (no database needed).
            - run: pnpm test:scripts

    functions:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: supabase/functions

        steps:
            - uses: actions/checkout@v4

            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - run: deno task check
            - run: deno task test

    database:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: supabase/setup-cli@v1
              with:
                  version: 2.9.6

            # Migrations and seed.sql run on start. Auth and Storage stay up: the seed writes
            # auth.users/identities and the migrations write storage.buckets.
            - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
            - run: supabase test db

            # The generated masked-field list (app/src/@types/maskedFields.generated.ts) against
            # public.field_class, in the database container (docker exec, as locally).
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: node --test scripts/masked-fields.test.mjs
              env:
                  MASKED_FIELDS_REQUIRE_DB: '1'

    # Cloudflare Pages previews read the staging project (moesa-panel-staging). After a pull
    # request's database tests pass, staging is rebuilt from that branch's migrations and seed,
    # so the newest preview and its database match. Older previews are not kept working.
    staging:
        if: github.event_name == 'pull_request'
        needs: database
        runs-on: ubuntu-latest
        concurrency:
            group: staging-db
            cancel-in-progress: false
        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
            STAGING_PROJECT_REF: tagnpmnmfvfadraubeom
        steps:
            - uses: actions/checkout@v4

            # CLI 3.x: `db reset --linked` works on a hosted project (2.x fails on the auth
            # sequence owner) and the local config needs its mail section under the 3.x name.
            - uses: supabase/setup-cli@v1
              with:
                  version: 3.0.0

            - run: sed -i 's/^\[inbucket\]/[local_smtp]/' supabase/config.toml
            - run: supabase link --project-ref "$STAGING_PROJECT_REF"
            # The app reads and writes through the `api` schema (064 closes `public` to users), so
            # PostgREST on staging must expose it before the reset applies the cutover.
            - name: Expose the api schema on staging
              run: >-
                  curl -fsS -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
                  -H 'Content-Type: application/json'
                  "https://api.supabase.com/v1/projects/$STAGING_PROJECT_REF/postgrest"
                  --data '{"db_schema":"public,api"}'
            - run: supabase db reset --linked --yes

            # The Edge Functions of this branch, so the preview calls the same code it was built with.
            - run: supabase functions deploy --project-ref "$STAGING_PROJECT_REF" --yes

            # Function secrets: the Amazon sandbox app (SP-API) and the URLs the functions link to.
            # APP_URL is the preview's branch alias (Cloudflare: lower case, other characters to '-',
            # at most 28 characters). Values come from repository secrets and are masked in the log.
            - name: Set the staging function secrets
              env:
                  LWA_CLIENT_ID: ${{ secrets.STAGING_AMAZON_SPAPI_LWA_CLIENT_ID }}
                  LWA_CLIENT_SECRET: ${{ secrets.STAGING_AMAZON_SPAPI_LWA_CLIENT_SECRET }}
                  REFRESH_TOKEN: ${{ secrets.STAGING_AMAZON_SPAPI_REFRESH_TOKEN }}
                  STATE_SECRET: ${{ secrets.STAGING_AMAZON_SPAPI_STATE_SECRET }}
              run: |
                  alias=$(printf '%s' "$GITHUB_HEAD_REF" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/-*$//')
                  umask 077
                  cat > /tmp/staging-functions.env <<EOF
                  AMAZON_SPAPI_ENV=sandbox
                  AMAZON_SPAPI_REGION=eu
                  AMAZON_SPAPI_LWA_CLIENT_ID=$LWA_CLIENT_ID
                  AMAZON_SPAPI_LWA_CLIENT_SECRET=$LWA_CLIENT_SECRET
                  AMAZON_SPAPI_REFRESH_TOKEN=$REFRESH_TOKEN
                  AMAZON_SPAPI_STATE_SECRET=$STATE_SECRET
                  APP_URL=https://$alias.moesa-panel.pages.dev
                  PUBLIC_SUPABASE_URL=https://$STAGING_PROJECT_REF.supabase.co
                  EOF
                  sed -i 's/^ *//' /tmp/staging-functions.env
                  supabase secrets set --project-ref "$STAGING_PROJECT_REF" --env-file /tmp/staging-functions.env --yes
                  rm -f /tmp/staging-functions.env

            # The reset emptied Vault: the pg_cron jobs (migration 047) read the functions' URL and the
            # service-role key from it. The key is read from the Management API, never printed.
            - name: Set the staging Vault secrets for pg_cron
              run: |
                  api=https://api.supabase.com/v1/projects/$STAGING_PROJECT_REF
                  key=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api/api-keys?reveal=true" \
                      | jq -r '.[] | select(.name == "service_role") | .api_key')
                  test -n "$key" || { echo "no service_role key"; exit 1; }
                  echo "::add-mask::$key"
                  url="https://$STAGING_PROJECT_REF.supabase.co/functions/v1"
                  # Dollar quoting: neither value contains $v$.
                  query="DELETE FROM vault.secrets WHERE name IN ('edge_function_url', 'edge_service_key');
                  SELECT vault.create_secret(\$v\$$url\$v\$, 'edge_function_url', 'Edge Functions base URL for pg_cron');
                  SELECT vault.create_secret(\$v\$$key\$v\$, 'edge_service_key', 'Service key for pg_cron calls');"
                  jq -n --arg q "$query" '{query: $q}' > /tmp/vault.json
                  curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                      -H 'Content-Type: application/json' "$api/database/query" --data @/tmp/vault.json
                  rm -f /tmp/vault.json
